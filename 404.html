<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; img-src 'self'; style-src 'unsafe-inline'; form-action 'none'">
    <meta name="theme-color" content="#101014">
    <meta name="robots" content="noindex">
    <link rel="icon" href="/assets/icon/Icono.ico">
    <title>404 — Página no encontrada | Asier Mariné</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #101014;
            color: #f2f4f3;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }

        * { box-sizing: border-box; }

        body {
            display: grid;
            min-height: 100vh;
            min-height: 100svh;
            margin: 0;
            padding: 32px 24px;
            place-items: center;
            background:
                radial-gradient(ellipse at 75% 30%, rgba(86, 32, 233, 0.26), transparent 44%),
                linear-gradient(135deg, #101014 0%, #1c1930 58%, #30205f 100%);
        }

        main {
            width: min(100%, 760px);
            padding: clamp(32px, 8vw, 72px);
            clip-path: polygon(
                14.62% 2.46%,
                54.41% 2.46%,
                55.93% 0,
                100% 0,
                100% 100%,
                87.03% 100%,
                85.51% 97.54%,
                45.72% 97.54%,
                44.19% 100%,
                0 100%,
                0 0,
                13.10% 0
            );
            background: rgba(242, 244, 243, 0.1);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.24);
        }

        .eyebrow {
            margin: 0 0 12px;
            color: #00c853;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.5rem, 8vw, 5.25rem);
            font-weight: 700;
            letter-spacing: -0.06em;
            line-height: 1;
        }

        .code {
            display: block;
            margin-bottom: 20px;
            color: rgba(242, 244, 243, 0.18);
            font-size: clamp(5.5rem, 24vw, 11rem);
            font-weight: 700;
            letter-spacing: -0.1em;
            line-height: 0.82;
        }

        .message {
            max-width: 38rem;
            margin: 24px 0 32px;
            color: rgba(242, 244, 243, 0.72);
            font-size: clamp(1rem, 2.5vw, 1.15rem);
            line-height: 1.7;
        }

        a {
            display: inline-flex;
            min-height: 48px;
            align-items: center;
            justify-content: center;
            padding: 12px 22px;
            background: #00c853;
            color: #101014;
            font-weight: 700;
            text-decoration: none;
            transition: background-color 180ms ease, transform 180ms ease;
        }

        a:hover {
            background: #38e879;
            transform: translateY(-2px);
        }

        a:focus-visible {
            outline: 3px solid #f2f4f3;
            outline-offset: 4px;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">Asier Mariné · Portfolio</p>
        <span class="code" aria-hidden="true">404</span>
        <h1>Página no encontrada</h1>
        <p class="message">Parece que este enlace ya no existe o ha cambiado de dirección. Puedes volver al inicio y seguir explorando desde allí.</p>
        <a href="/index.html">Volver al inicio</a>
    </main>
</body>
</html>
